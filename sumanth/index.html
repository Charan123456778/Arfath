<!DOCTYPE html>
<html>
<head>
    <title>Pawan Kalyan Dialogue Animation</title>

    <style>
        body {
            margin: 0;
            background: black;
            color: white;
            font-family: Arial;
            text-align: center;
            overflow: hidden;
        }

        .container {
            margin-top: 180px;
        }

        h1 {
            color: red;
            animation: glow 1.5s infinite alternate;
        }

        #dialogue {
            font-size: 35px;
            font-weight: bold;
            margin: 30px;
            min-height: 60px;
        }

        button {
            padding: 12px 25px;
            font-size: 18px;
            background: red;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            transform: scale(1.1);
            background: darkred;
        }

        @keyframes glow {
            from {
                text-shadow: 0 0 5px red;
            }
            to {
                text-shadow: 0 0 25px red;
            }
        }

        .show {
            animation: zoom 1s ease;
        }

        @keyframes zoom {
            from {
                transform: scale(0.3);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>⚡ POWER STAR ⚡</h1>

        <div id="dialogue"></div>

        <button onclick="startDialogue()">
            ▶ Start Dialogue
        </button>

    </div>

    <script>

        let dialogues = [
            "న్యాయం కోసం నిలబడితే... భయం ఎందుకు?",
            "మనసులో నిజం ఉంటే... మన అడుగును ఎవ్వరూ ఆపలేరు!",
            "Power is not in words...",
            "Power is in the courage to stand for what is right!"
        ];

        let index = 0;

        function startDialogue() {

            index = 0;

            showDialogue();

        }

        function showDialogue() {

            if (index < dialogues.length) {

                let text = dialogues[index];

                let dialogue = document.getElementById("dialogue");

                dialogue.innerHTML = "";

                dialogue.classList.remove("show");

                void dialogue.offsetWidth;

                dialogue.classList.add("show");

                let i = 0;

                let typing = setInterval(function() {

                    dialogue.innerHTML += text.charAt(i);

                    i++;

                    if (i >= text.length) {

                        clearInterval(typing);

                        setTimeout(function() {

                            index++;

                            showDialogue();

                        }, 1500);
                    }

                }, 70);

            }
        }

    </script>

</body>
</html>
