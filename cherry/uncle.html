<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Builder</title>

    <style>
        body {
            font-family: Arial;
            background: #eaf3ff;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
        }

        h1 {
            text-align: center;
            color: #1565c0;
        }

        h2 {
            color: #1565c0;
        }

        input, textarea {
            width: 95%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #aaa;
            border-radius: 5px;
        }

        textarea {
            height: 70px;
        }

        button {
            background: #1565c0;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin: 10px 5px;
        }

        button:hover {
            background: #0d47a1;
        }

        #resume {
            display: none;
            margin-top: 30px;
            padding: 25px;
            border: 2px solid #1565c0;
        }

        #resume h1 {
            text-align: left;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>AI Resume Builder</h1>

    <h2>Personal Details</h2>

    <input type="text" id="name" placeholder="Full Name">

    <input type="email" id="email" placeholder="Email">

    <input type="text" id="phone" placeholder="Phone Number">

    <input type="text" id="address" placeholder="Address">


    <h2>Career Objective</h2>

    <textarea id="objective"
        placeholder="Career Objective"></textarea>


    <h2>Education</h2>

    <textarea id="education"
        placeholder="Education Details"></textarea>


    <h2>Skills</h2>

    <textarea id="skills"
        placeholder="Java, Python, HTML, CSS, JavaScript"></textarea>


    <h2>Projects</h2>

    <textarea id="projects"
        placeholder="Project Details"></textarea>


    <h2>Experience</h2>

    <textarea id="experience"
        placeholder="Experience / Internship"></textarea>


    <button onclick="aiObjective()">
        AI Suggestion
    </button>

    <button onclick="createResume()">
        Generate Resume
    </button>


    <div id="resume">

        <h1 id="showName"></h1>

        <p>
            <b>Email:</b> <span id="showEmail"></span>
        </p>

        <p>
            <b>Phone:</b> <span id="showPhone"></span>
        </p>

        <p>
            <b>Address:</b> <span id="showAddress"></span>
        </p>

        <h2>Career Objective</h2>
        <p id="showObjective"></p>

        <h2>Education</h2>
        <p id="showEducation"></p>

        <h2>Skills</h2>
        <p id="showSkills"></p>

        <h2>Projects</h2>
        <p id="showProjects"></p>

        <h2>Experience</h2>
        <p id="showExperience"></p>

    </div>

</div>


<script>

function aiObjective() {

    document.getElementById("objective").value =
    "Motivated BCA graduate with strong knowledge of programming and web technologies. Seeking an opportunity to apply technical skills and develop innovative software solutions.";
}


function createResume() {

    document.getElementById("showName").innerHTML =
        document.getElementById("name").value;

    document.getElementById("showEmail").innerHTML =
        document.getElementById("email").value;

    document.getElementById("showPhone").innerHTML =
        document.getElementById("phone").value;

    document.getElementById("showAddress").innerHTML =
        document.getElementById("address").value;

    document.getElementById("showObjective").innerHTML =
        document.getElementById("objective").value;

    document.getElementById("showEducation").innerHTML =
        document.getElementById("education").value;

    document.getElementById("showSkills").innerHTML =
        document.getElementById("skills").value;

    document.getElementById("showProjects").innerHTML =
        document.getElementById("projects").value;

    document.getElementById("showExperience").innerHTML =
        document.getElementById("experience").value;

    document.getElementById("resume").style.display = "block";
}

</script>

</body>
</html>
