<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Foodie - Food Order App</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f7f8fa;
            color: #222;
        }

        /* HEADER */

        header {
            background: linear-gradient(135deg, #ff512f, #dd2476);
            color: white;
            padding: 20px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
        }

        .logo span {
            color: #ffe600;
        }

        .cart {
            background: white;
            color: #ff512f;
            padding: 10px 18px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: bold;
        }

        /* HERO */

        .hero {
            min-height: 350px;
            padding: 70px 7%;
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(120deg, #fff2e2, #ffe1e1);
        }

        .hero-text {
            max-width: 550px;
        }

        .hero h1 {
            font-size: 50px;
            color: #222;
            margin-bottom: 15px;
        }

        .hero h1 span {
            color: #ff4b2b;
        }

        .hero p {
            font-size: 18px;
            color: #666;
            margin-bottom: 25px;
        }

        .order-btn {
            background: #ff4b2b;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 30px;
            font-size: 17px;
            cursor: pointer;
        }

        .order-btn:hover {
            background: #d9361e;
            transform: scale(1.05);
        }

        .food-emoji {
            font-size: 150px;
            animation: float 3s infinite;
        }

        @keyframes float {
            50% {
                transform: translateY(-15px) rotate(3deg);
            }
        }

        /* SEARCH */

        .search-box {
            text-align: center;
            padding: 25px;
        }

        .search-box input {
            width: 80%;
            max-width: 600px;
            padding: 15px 20px;
            border: none;
            border-radius: 30px;
            box-shadow: 0 3px 15px #ddd;
            font-size: 16px;
            outline: none;
        }

        /* CATEGORIES */

        .categories {
            text-align: center;
            padding: 10px;
        }

        .category-btn {
            padding: 10px 22px;
            margin: 5px;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            background: white;
            box-shadow: 0 3px 10px #ddd;
        }

        .category-btn:hover {
            background: #ff4b2b;
            color: white;
        }

        /* FOOD */

        .food-container {
            width: 90%;
            max-width: 1200px;
            margin: 30px auto;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 25px;
        }

        .food-card {
            background: white;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 5px 20px #ddd;
            transition: 0.3s;
        }
